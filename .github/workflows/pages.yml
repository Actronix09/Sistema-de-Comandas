# Publica la app (cliente en Qt compilado a WebAssembly) en GitHub Pages:
#   https://actronix09.github.io/Sistema-de-Comandas/
#
# Compila con cliente/Containerfile.web, el mismo que se usa en local. La capa
# que baja Qt y Emscripten (~1.5 GB) se guarda en la caché de Actions, así que
# solo la primera vez tarda; después solo se recompila el cliente.
#
# Compilar y publicar van en dos jobs, como en la plantilla de GitHub: si se
# publica en el mismo job, a veces GitHub todavía no muestra el paquete recién
# subido y deploy-pages falla con "No artifacts named github-pages".
name: Publicar la app web

on:
  push:
    branches: [main]
    paths:
      - "cliente/**"
      - "comun/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  compilar:
    runs-on: ubuntu-latest
    env:
      # La acción de Docker sube por su cuenta un registro de la compilación;
      # no se usa y es un paquete más junto al de la página
      DOCKER_BUILD_RECORD_UPLOAD: false
      DOCKER_BUILD_SUMMARY: false
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Compilar para WebAssembly
        uses: docker/build-push-action@v7
        with:
          context: .
          file: cliente/Containerfile.web
          outputs: type=local,dest=cliente/web
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: cliente/web

  publicar:
    needs: compilar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacion.outputs.page_url }}
    steps:
      - id: publicacion
        uses: actions/deploy-pages@v5
